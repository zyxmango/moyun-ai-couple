services:
  aistor:
    image: quay.io/minio/aistor/minio:latest
    command:
      - minio
      - server
      - /mnt/data
      - --license
      - /minio.license
    environment:
      MINIO_ROOT_USER: ${AISTOR_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AISTOR_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - aistor_data:/mnt/data
      - ./aistor/minio.license:/minio.license:ro

  backend:
    environment:
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://aistor:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${AISTOR_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${AISTOR_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-couple-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-3600}
    depends_on:
      aistor:
        condition: service_started

volumes:
  aistor_data:
